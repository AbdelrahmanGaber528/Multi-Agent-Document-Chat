services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      # Chroma (
      - vector_db:/app/data/vector_db
      # Keeps the downloaded embedding model, so it is not fetched again after a rebuild
      - hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s  # first start downloads the embedding model
    restart: unless-stopped

volumes:
  vector_db:
  hf_cache: